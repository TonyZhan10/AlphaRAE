[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpharae"
version = "0.1.0"
description = "AlphaRAE RGBA reconstruction codecs"
requires-python = ">=3.10,<3.14"
authors = [{name = "Jiabo Zhan"}]
dependencies = ["torch>=2.8,<2.11", "torchvision>=0.23,<0.26", "numpy>=1.26,<3", "Pillow>=10", "PyYAML>=6", "timm>=1.0.16", "transformers>=4.56,<5", "omegaconf==2.3.0", "einops>=0.8", "lpips==0.1.4", "scipy>=1.11", "tqdm>=4.66", "huggingface_hub>=0.36,<1"]

[project.optional-dependencies]
evaluation = ["pyiqa==0.1.16", "torch-fidelity", "torchmetrics"]
training = ["pyiqa==0.1.16", "torch-fidelity", "torchmetrics"]
ray = ["ray>=2.48"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["alpharae*"]
